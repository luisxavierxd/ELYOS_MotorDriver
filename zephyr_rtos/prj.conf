# C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Console and logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

# Enable GPIO
CONFIG_GPIO=y

# Enable PWM
CONFIG_PWM=y

# Enable ADC
CONFIG_ADC=y

# Enable SPI
CONFIG_SPI=y

# Full capabilities
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
